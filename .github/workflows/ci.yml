name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      # canvas.ts and markers.ts are pure and covered by real vitest suites now
      # (src/*.test.ts) — run them before the build, so a regression fails here
      # instead of in someone's vault. They existed for a while without this
      # step wired in, which meant nothing actually ran them.
      - run: npm test -- --run
      # `build` runs `tsc --noEmit` before bundling, so a type error fails here
      # rather than in someone's vault. esbuild alone would happily bundle it.
      - run: npm run build
      # The three files Obsidian actually loads. A build that doesn't produce
      # them is a release nobody can install.
      - name: Check release artifacts exist
        run: test -f main.js && test -f manifest.json && test -f styles.css
